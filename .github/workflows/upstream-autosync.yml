name: Upstream Sync

on:
  schedule:
    - cron: "0 0 */3 * *" # Every 3 days at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.compare.outputs.should_sync }}

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check commits behind upstream
        id: compare
        run: |
          git remote add upstream https://github.com/MRT-Map/slowroute.git || true
          git fetch upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "Fork is $BEHIND commits behind upstream"
          if [ "$BEHIND" -ge 1 ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          fi
  sync:
    needs: check
    if: needs.check.outputs.should_sync == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork (with credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Check sync token is present
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_AUTOSYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            echo "Sync token is present"
          else
            echo "Sync token is missing"
            exit 1
          fi
          
      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@83d78e8c4bf524e79b091cf257deba4dee9e60df
        with:
          target_sync_branch: main
          target_repo_token: ${{ secrets.UPSTREAM_AUTOSYNC_TOKEN }}
          upstream_sync_branch: main
          upstream_sync_repo: MRT-Map/slowroute
          upstream_repo_access_token: ${{ secrets.UPSTREAM_AUTOSYNC_TOKEN }}
