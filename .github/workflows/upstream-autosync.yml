name: Upstream Sync

on:
  schedule:
    - cron: "0 0 */3 * *" # Every 3 days at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  workflows: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.compare.outputs.should_sync }}

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check commits behind upstream
        id: compare
        run: |
          git remote add upstream https://github.com/MRT-Map/slowroute.git || true
          git fetch upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)

          echo "Fork is $BEHIND commits behind upstream"

          if [ "$BEHIND" -ge 1 ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.should_sync == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork (with credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main
          # Uses your PAT stored as an Actions secret:
          target_repo_token: ${{ secrets.UPSTREAM_AUTOSYNC_TOKEN }}
          upstream_sync_repo: MRT-Map/slowroute
          upstream_sync_branch: main
